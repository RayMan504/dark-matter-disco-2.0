<style>
</style>

<main class="main">
  <div class="content text-light h-100">
    <div id="header">
      @if(hostUsername) {
        <div class="host-invite">
          {{ hostUsername }} wants to dance!
          <button class="btn btn-success">Initiate Dance Battle!</button>
        </div>
      }
      @if(inviteeUsername) {
        <div class="invitee-invite">
          waiting for {{ inviteeUsername }}...
        </div>
      }
    </div>

    <!-- DANCE FLOOR -->
    <app-dance-floor id="dance-floor"
    ></app-dance-floor>

    <!-- TOOLBAR -->
    <div class="d-flex justify-content-between">
      <app-toolbar></app-toolbar>

      <!-- RIGHT SIDE BAR -->
      <div id="rightbar" class="d-flex flex-column p-3 justify-content-between text-right">
        <div>
          <h4 class="text-light">
            {{ username }} 
            <img src="../assets/star2.jpeg" class="user-star" />
            {{ userStars }}
          </h4>
        </div>
      </div>
    </div>
  </div>
</main>
